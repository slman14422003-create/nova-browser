name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.4', cache-read-only: true }
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality
      # يجب أن يُترجَم الكود فعلياً أثناء التحليل: نعطّل كاش البناء ونعيد تنفيذ كل المهام
      # وإلا تظهر المهام FROM-CACHE فلا يرى CodeQL أي كود Java/Kotlin ويفشل.
      - name: Build for CodeQL (no cache)
        run: gradle clean assembleDebug --no-daemon --no-build-cache --rerun-tasks -Dorg.gradle.caching=false -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false
      - uses: github/codeql-action/analyze@v4
        with: { category: '/language:java-kotlin' }
